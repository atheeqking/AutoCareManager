services:
  postgres:
    image: postgres:16-alpine
    container_name: autocare_manager
    environment:
      POSTGRES_DB: autocare_manager
      POSTGRES_USER: autocare
      POSTGRES_PASSWORD: password
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
