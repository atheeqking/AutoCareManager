spring.application.name=autocare-manager
server.port=${SERVER_PORT:8080}
spring.profiles.default=postgres
spring.jackson.default-property-inclusion=non_null
logging.level.com.autocare=INFO
app.security.jwt.secret=${JWT_SECRET:change-this-local-development-secret-to-a-minimum-of-32-characters}
app.security.jwt.expiration=${JWT_EXPIRATION:3600}
app.security.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.security.google-enabled=false
