spring.application.name=autocare-manager
server.port=${SERVER_PORT:8080}
spring.profiles.default=postgres
spring.jackson.default-property-inclusion=non_null
logging.level.com.autocare=INFO
# Required. The API refuses to start unless JWT_SECRET is set to at least 32 characters.
app.security.jwt.secret=${JWT_SECRET:}
app.security.jwt.expiration=${JWT_EXPIRATION:3600}
app.security.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.security.google-enabled=false
# Demo workshop accounts (owner/manager/employee@autocare.com) are disabled unless this is true.
app.security.demo-accounts=${DEMO_ACCOUNTS_ENABLED:false}
