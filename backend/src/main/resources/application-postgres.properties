# Activate with SPRING_PROFILES_ACTIVE=postgres.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/autocare_manager}
spring.datasource.username=${DB_USERNAME:autocare}
spring.datasource.password=${DB_PASSWORD:change-me}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
