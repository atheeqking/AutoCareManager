# Activate with SPRING_PROFILES_ACTIVE=postgres (the default profile).
# Defaults match compose.yaml for local development only; set DB_* for any other environment.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/autocare_manager}
spring.datasource.username=${DB_USERNAME:autocare}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
